<!DOCTYPE html>
<html>
<head>
    <title>IntelliGRC API Documentation</title>
    <!-- needed for adaptive design -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700|Roboto:300,400,700" rel="stylesheet">

    <!--
    Redoc doesn't change outer page styles
    -->
    <link href="index.css" rel="stylesheet" type="text/css">
    
                <style>
                    .sc-gfoqjT {
                        display: none !important;
                    }
                </style>
                    
                <style id='theme-style'></style>

                <button id='theme-toggle' style='
                    position: fixed; 
                    top: 10px; 
                    right: 10px; 
                    z-index: 1000; 
                    padding: 10px 15px; 
                    background: #00bcd4; /* Bright cyan */
                    color: #121212; /* Dark text */
                    font-weight: bold;
                    border: 2px solid #ffffff; 
                    border-radius: 8px;
                    cursor: pointer;
                    transition: background 0.3s, color 0.3s;
                '>
                    Dark Mode
                </button>

                <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const button = document.getElementById('theme-toggle');
                    const themeStyle = document.getElementById('theme-style');

                    // Check local storage for theme preference and apply
                    if (localStorage.getItem('theme') === 'dark') {
                        enableDarkMode();
                    }

                    button.addEventListener('click', function() {
                        if (document.body.classList.contains('dark-mode')) {
                            disableDarkMode();
                        } else {
                            enableDarkMode();
                        }
                    });

                    function enableDarkMode() {
                        document.body.classList.add('dark-mode');
                        themeStyle.innerHTML = `
                            /* === Global Styles === */
                            body {
                                background-color: #1e1e1e !important;
                                color: #ffffff !important;
                                font-family: 'Roboto', sans-serif;
                            }

                            /* === Sidebar Styles === */
                            .menu-content {
                                background-color: #121212 !important;
                            }

                            .sc-fBdRDi, .sc-dPZUQH {
                                background-color: #121212 !important;
                                color: #ffffff !important;
                            }

                            /* Sidebar links */
                            .sc-kbhJrz, .sc-jlZhew {
                                color: #ffffff !important;
                            }
                            .sc-kbhJrz:hover, .sc-jlZhew:hover {
                                color: #00bcd4 !important;
                            }

                            /* === Main Content Styles === */
                            .api-content {
                                background-color: #1e1e1e !important;
                                color: #ffffff !important;
                            }

                            /* Headings */
                            h1, h2, h3, h4, h5, h6 {
                                color: #ffffff !important;
                            }

                            /* API Section Titles */
                            .sc-jXbUNg {
                                color: #ffffff !important;
                                border-bottom: 2px solid #333333 !important;
                                padding-bottom: 5px;
                            }

                            /* === Table Styles === */
                            th {
                                background-color: #333333 !important;
                                color: #ffffff !important;
                            }
                            td {
                                background-color: #252525 !important;
                                color: #ffffff !important;
                                border: 1px solid #444444 !important;
                            }

                            /* === Links === */
                            a {
                                color: #00bcd4 !important;
                            }
                            a:hover {
                                color: #82e9ff !important;
                            }

                            /* === Code Blocks === */
                            pre, code {
                                background-color: #333333 !important;
                                color: #ffffff !important;
                                border-radius: 5px;
                                padding: 10px;
                                font-family: 'Courier New', monospace;
                            }

                            /* === Buttons === */
                            button {
                                background-color: #333333 !important;
                                color: #ffffff !important;
                                border: 1px solid #444444 !important;
                            }
                            button:hover {
                                background-color: #555555 !important;
                            }

                            /* === Input Fields === */
                            input, select, textarea {
                                background-color: #252525 !important;
                                color: #ffffff !important;
                                border: 1px solid #444444 !important;
                            }

                            /* === Dropdown Menu Styles === */
                            .sc-iHmpnF {
                                background-color: #121212;
                                color: #ffffff !important;
                            }

                            .sc-cWSHoV {
                                background-color: #121212;
                                color: #ffffff !important;
 
                            }

                            .sc-kYxDKI, .sc-bpUBKd {
                                background-color: #252525 !important;
                                color: #ffffff !important;
                            }

                            .sc-kYxDKI:hover, .sc-bpUBKd:hover {
                                background-color: #333333 !important;
                                color: #00bcd4 !important;
                            }

                            /* === Fix Parameter Type Text Color === */
                            .sc-fPXMVe, .sc-gFAWRd, .sc-cfxfcM, .sc-Nxspf {
                                color: #ffffff !important;
                            }
                        `;
                        button.innerText = 'Light Mode';
                        button.style.background = '#ff9800'; /* Orange button in dark mode */
                        button.style.color = '#ffffff';
                        button.style.border = '2px solid #ff9800';

                        localStorage.setItem('theme', 'dark');
                    }

                    function disableDarkMode() {
                        document.body.classList.remove('dark-mode');
                        themeStyle.innerHTML = ''; // Remove dark mode styles
                        button.innerText = 'Dark Mode';
                        button.style.background = '#00bcd4'; /* Cyan button in light mode */
                        button.style.color = '#121212';
                        button.style.border = '2px solid #ffffff';

                        localStorage.setItem('theme', 'light');
                    }
                });
                </script>
</head>
<body>
    <div id="redoc-container"></div>
    <script src="redoc.standalone.js"></script>
    <script src="index.js"></script>
</body>
</html>
